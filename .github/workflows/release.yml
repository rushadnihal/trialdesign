name: Release

# Pushing a tag such as v0.2.0 builds the package, uploads it to TestPyPI, installs it back
# from TestPyPI in a clean environment, and then uploads it to PyPI. Every upload uses PyPI
# Trusted Publishing, so no API token is stored. The `pypi` environment should require a
# reviewer in the repository settings, so the real upload waits for a person to approve it:
# a version number can never be reused on PyPI once uploaded.
#
# Running the workflow by hand (Actions > Release > Run workflow) stops after TestPyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gsdtrial
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  check-testpypi:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from TestPyPI in a clean environment
        run: |
          python -m venv /tmp/check
          # Dependencies come from PyPI; only gsdtrial itself from TestPyPI.
          for i in 1 2 3 4 5; do
            /tmp/check/bin/pip install --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "gsdtrial==${{ needs.build.outputs.version }}" && break
            sleep 30  # TestPyPI can take a moment to serve a new upload
          done
          /tmp/check/bin/trialdesign --version
          /tmp/check/bin/trialdesign design --endpoint survival --hr 0.7 --looks 3 --futility obf
          /tmp/check/bin/python -c "import trialdesign; print(trialdesign.__version__)"

  pypi:
    needs: check-testpypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gsdtrial
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
